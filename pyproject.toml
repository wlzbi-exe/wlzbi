[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlzbi"
version = "1.0.2"
description = "Simple colorful terminal logo generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "WLZBI"}
]
dependencies = [
    "cfonts",
    "colorama"
]

[project.urls]
Homepage = "https://pypi.org/project/wlzbi/"

[tool.setuptools.packages.find]
include = ["wlzbi*"]
